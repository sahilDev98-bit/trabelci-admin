server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # forensic audit F-10: this panel previously shipped with no security
    # headers at all. Included in every location block below rather than
    # just set here, since nginx only inherits a parent's add_header
    # directives into a location with none of its own, and the two asset
    # blocks below already set Cache-Control.
    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }

    # nginx:alpine's stock mime.types has no .mjs entry, so it falls back to
    # default_type (not a JS type) for these — browsers then refuse to run
    # them as ES modules (this is what breaks pdfjs-dist's worker, loaded via
    # dynamic import, in production only; Vite's dev server sets this
    # correctly on its own, which is why it never showed up locally).
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
