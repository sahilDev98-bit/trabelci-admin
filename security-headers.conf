# Shared by every location block in nginx.conf — nginx only inherits a
# parent scope's add_header directives into a location that defines none of
# its own, and both asset location blocks below already set Cache-Control,
# so without this include they'd silently drop these (forensic audit F-10).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Report-Only: this app embeds several other origins via iframe
# (VITE_ROOM_VISUALIZER_URL, VITE_EXTRACT_PDF_URL, VITE_PDF_EXTRACT_URL — see
# src/pages/create-pdf/ and src/pages/extract-product-pdf/) and calls out to
# VITE_ADMIN_API_BASE_URL and Supabase, none of which are known here since
# this file is a static COPY with no env substitution (see Dockerfile) —
# baking in the wrong origin would silently break the PDF/AI-image tools.
# Report-Only can never block a request, so this is safe to ship as-is: open
# the admin panel, exercise every page (especially Create PDF / Extract
# Product PDF / AI Images), and check the browser console for CSP violation
# reports. Once nothing legitimate is being reported, replace
# connect-src/frame-src below with the exact origins from those VITE_*
# variables and rename the header to Content-Security-Policy to enforce it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
